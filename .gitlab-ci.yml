stages:
  - lint-typecheck
  - test
  - build-frontend
  - build-binary

variables:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
  paths:
    - frontend/node_modules/
    - frontend/.pnpm-store/
    - backend/.venv/
    - .cache/pip/
    - .cache/uv/

lint-typecheck:
  stage: lint-typecheck
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install uv
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - cd frontend && pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - cd ../backend && uv sync --frozen
    - uv run ruff check .
    - uv run mypy .
  artifacts:
    reports:
      codequality: backend/ruff-report.json
    when: always
    expire_in: 1 week

test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache python3 py3-pip gcc musl-dev linux-headers
    - pip install uv
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - cd frontend && pnpm install --frozen-lockfile
    - pnpm test:coverage
    - cd ../backend && uv sync --frozen
    - uv run pytest --cov=app --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week

build-frontend:
  stage: build-frontend
  image: node:${NODE_VERSION}-alpine
  needs: [lint-typecheck, test]
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir .pnpm-store
  script:
    - cd frontend && pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

build-binary-windows:
  stage: build-binary
  image: mcr.microsoft.com/windows/servercore:ltsc2022
  needs: [build-frontend]
  before_script:
    - choco install python --version=3.11 -y
    - refreshenv
    - pip install uv pyinstaller pyarmor
  script:
    - cd backend
    - uv sync --frozen
    - pyarmor gen --exact app/core/security/licensing.py app/core/security/hardware.py || echo "PyArmor failed, continuing..."
    - pyinstaller --noconfirm --onedir --windowed --add-data "frontend/dist;dist" --hidden-import "sqlcipher3" --name "LeuitApp" main.py
  artifacts:
    paths:
      - backend/dist/LeuitApp/
    expire_in: 30 days
  tags:
    - windows

build-binary-linux:
  stage: build-binary
  image: python:3.11-slim
  needs: [build-frontend]
  before_script:
    - apt-get update && apt-get install -y git wget
    - pip install uv pyinstaller pyarmor
  script:
    - cd backend
    - uv sync --frozen
    - pyarmor gen --exact app/core/security/licensing.py app/core/security/hardware.py || echo "PyArmor failed, continuing..."
    - pyinstaller --noconfirm --onedir --windowed --add-data "frontend/dist:dist" --hidden-import "sqlcipher3" --name "LeuitApp" main.py
  artifacts:
    paths:
      - backend/dist/LeuitApp/
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-binary-windows, build-binary-linux]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG --ref $CI_COMMIT_SHA --assets-link="{\"name\":\"LeuitApp-win64.zip\",\"url\":\"${CI_JOB_URL}/artifacts/backend/dist/LeuitApp/\"}" --assets-link="{\"name\":\"LeuitApp-linux.tar.gz\",\"url\":\"${CI_JOB_URL}/artifacts/backend/dist/LeuitApp/\"}"