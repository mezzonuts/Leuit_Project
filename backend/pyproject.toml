[project]
name = "leuit-backend"
version = "1.0.0"
description = "LEUIT Backend - Local-First F&B Demand & Inventory Forecasting API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  {name = "LEUIT Team", email = "dev@leuit.app"}
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.30",
  "pysqlcipher3>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "prophet>=1.1.5",
  "holidays>=0.45.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "pynacl>=1.5.0",
  "pyarmor>=8.5.0",
  "pyinstaller>=6.5.0",
  "loguru>=0.7.2",
  "orjson>=3.9.0",
  "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-requests>=2.31.0",
  "types-pandas",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP007", "W292", "W291", "W293", "W391", "E302", "E303", "E128", "E127", "E126", "E125", "E124", "E131", "E117", "E711", "E712", "E721", "W605", "E122", "E123", "E121", "E116", "E114", "E115", "E131", "E128", "W191", "E101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S101", "T201"]
"tests/*" = ["S101", "T201", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
allow_untyped_globals = false
enable_error_code = ["ignore-without-action"]
exclude = [
  "scripts/*",
  "build/*",
  "dist/*",
  ".venv/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config --no-header"
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
  "*/tests/*",
  "*/scripts/*",
  "*/migrations/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"